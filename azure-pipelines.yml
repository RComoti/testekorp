# ==============================================================================
# Pipeline de CI (Build & Validação) - Desafio DevOps Korp
# ==============================================================================
# Escopo: Apenas Integração Contínua (CI)
# O deploy (CD) é gerenciado pelas definições de Release no Azure DevOps (Ansible-driven com set -e).
#
# Gatilhos automáticos nas branches do GitFlow: dev, homolog e main.
# Agente: Microsoft-hosted (ubuntu-latest).
# ==============================================================================

trigger:
  branches:
    include:
      - dev
      - homolog
      - main

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: BuildAndTest
    displayName: "CI - Build, Testes & Publicação de Artefatos"
    jobs:
      - job: CI_Job
        displayName: "Validação Unitária e Empacotamento"
        steps:
          # 1. Configurar versão do Go
          - task: GoTool@0
            displayName: "Instalar Golang 1.22"
            inputs:
              version: '1.22'

          # 2. Executar Testes Unitários em Go
          - script: |
              echo "==> Baixando dependências e rodando testes unitários..."
              cd app
              go mod download
              go test -v ./...
            displayName: "Executar testes unitários (Go)"

          # 3. Validar sintaxe do Playbook Ansible
          - script: |
              echo "==> Validando sintaxe do Playbook Ansible..."
              sudo apt-get update && sudo apt-get install -y ansible
              cd ansible
              ansible-playbook -i inventory.ini --syntax-check playbook.yml
            displayName: "Validar sintaxe do Ansible"

          # 4. Publicar artefato 'drop' para ser consumido pelas Releases
          - task: CopyFiles@2
            displayName: "Copiar arquivos do projeto para o artefato"
            inputs:
              SourceFolder: '$(Build.SourcesDirectory)'
              Contents: |
                app/**
                nginx/**
                monitoring/**
                ansible/**
                docker-compose.yml
              TargetFolder: '$(Build.ArtifactStagingDirectory)'

          - task: PublishBuildArtifacts@1
            displayName: "Publicar Artefato de Build (drop)"
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'drop'
              publishLocation: 'Container'
