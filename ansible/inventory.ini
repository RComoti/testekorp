[korp_servers]
# Execução local na própria máquina (padrão)
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3

# Para execução em uma VM ou servidor Linux remoto durante a avaliação,
# basta comentar a linha do localhost e configurar o host abaixo:
# target-server ansible_host=192.168.1.100 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa
